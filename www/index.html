<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="script-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Crypto Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--barh:64px;--bg:#e9eef2;--card:#fff;--text:#10222e;--muted:#5a6c78;--line:#d3dde4;--ok:#0f8a5f;--gold:#e8a317;--gold2:#b86b00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e2d;--card:#182c40;--text:#eaf1f6;--muted:#93a8b8;--line:#25405a;--ok:#46d19b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1e2d;--card:#182c40;--text:#eaf1f6;--muted:#93a8b8;--line:#25405a;--ok:#46d19b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:8px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:2px 0 6px}
.ttl{font-weight:800;font-size:18px}
.ob{font-family:inherit;font-size:18px;width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.ob.wide{width:auto;min-width:42px;padding:0 10px;font-size:15px;font-weight:600;white-space:nowrap}
.ob.off{opacity:.5}
.top{text-align:center;padding:4px 0}
.bal{font-size:clamp(38px,11vw,54px);font-weight:800;letter-spacing:-1px;line-height:1.1}
.bal small{font-size:.45em;color:var(--gold2);margin-inline-start:6px}
.sub{color:var(--muted);margin-top:4px;font-size:14px}
.stage{display:grid;place-items:center;padding:20px 0 16px}
.coin{width:min(56vw,230px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 34% 28%,#fff6,var(--gold) 52%,var(--gold2));color:#fff;font-family:inherit;font-weight:800;font-size:min(20vw,78px);position:relative;text-shadow:0 3px 0 rgba(0,0,0,.2);box-shadow:0 12px 30px rgba(0,0,0,.25),inset 0 -10px 18px rgba(0,0,0,.18),inset 0 0 0 6px rgba(255,255,255,.28);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;transition:transform .07s;display:flex;flex-direction:row;direction:ltr;align-items:center;justify-content:center;gap:8px;padding:0 10px}
.coin span{font-size:1em;line-height:1}
.coin small{font-size:1em;font-weight:800;line-height:1;white-space:nowrap}
.coin:active{transform:scale(.92) rotate(-3deg)}
.fl{position:fixed;z-index:9;pointer-events:none;font-weight:800;font-size:22px;color:var(--gold2);text-shadow:0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,-50%);animation:pop .95s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:0}14%{opacity:1;transform:translate(-50%,-50%) scale(var(--s,1)) rotate(0)}100%{transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,-70px))) scale(var(--s,1)) rotate(var(--r,0deg));opacity:0}}
h2{font-size:17px;margin:20px 0 10px;font-weight:600}
.list{display:grid;gap:10px}
.up{display:flex;align-items:center;gap:12px;width:100%;text-align:start;font-family:inherit;font-size:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;touch-action:manipulation;transition:transform .1s,opacity .2s}
.up:active:not(.off){transform:scale(.98)}
.up.off{opacity:.5;cursor:not-allowed}
.ic{font-size:26px;width:44px;height:44px;display:grid;place-items:center;background:var(--bg);border-radius:10px;flex:none}
.inf{flex:1;min-width:0}
.nm{font-weight:600}
.ds{color:var(--muted);font-size:13px;margin-top:2px}
.pr{font-weight:800;white-space:nowrap}
.cnt{font-weight:800;color:var(--muted);min-width:26px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.gt{font-size:14px;margin-bottom:8px}
.bar2{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px;transition:width .3s}
.ai{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--muted)}
.ai b{display:block;font-size:14px;margin-bottom:2px;color:var(--text)}
.note{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.5}
.foot{margin-top:18px;text-align:center}
.rs{font-family:inherit;background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;cursor:pointer}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lg{font-family:inherit;font-size:15px;font-weight:600;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.lg.on{border-color:var(--gold2);box-shadow:inset 0 -3px 0 var(--gold2)}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bb{flex:1;min-width:0;min-height:48px;font-family:inherit;font-size:13px;font-weight:600;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb.on{border-color:var(--gold2);box-shadow:inset 0 -3px 0 var(--gold2)}
.sheet{position:fixed;inset:0;z-index:35}
.shbg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.shb{position:absolute;inset-inline:0;bottom:var(--barfull,calc(var(--barh) + env(safe-area-inset-bottom,0px)));max-height:calc(82vh - var(--barh));overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:sticky;top:-12px;background:var(--bg);padding:6px 0;z-index:1}
.shh b{font-size:18px}
.sec{font-size:15px;font-weight:600;margin:16px 0 8px}
.toast{position:fixed;inset-inline:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:12px;text-align:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--gold)}
/* ---- אנימציות ופוליש ---- */
.adb{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 10px;border:0;border-radius:23px;font-family:inherit;font-weight:800;font-size:19px;color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 4px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.45);cursor:pointer;touch-action:manipulation;animation:adpulse 2.4s ease-in-out infinite;transition:transform .1s,filter .25s}
.adb::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:adshine 3.4s ease-in-out infinite;pointer-events:none}
.adb:active{transform:scale(.94)}
.adi{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.28);font-size:14px;line-height:1}
.adt{letter-spacing:.3px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.adb.off{animation:none;filter:saturate(.45) brightness(.92);cursor:not-allowed}
.adb.off::after{display:none}
.adb.live{background:linear-gradient(135deg,#34d37e,#0b9a57);animation:none}
.adp{position:absolute;inset-inline-start:0;bottom:0;height:3px;width:0;background:rgba(255,255,255,.9);transition:width .3s}
@keyframes adpulse{50%{box-shadow:0 4px 22px var(--gold),inset 0 1px 0 rgba(255,255,255,.45)}}
@keyframes adshine{0%,55%{left:-60%}100%{left:140%}}
.coin{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{scale:1.025}}
.coin.tp::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.75);animation:ripple .46s ease-out forwards;pointer-events:none}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(1.4);opacity:0}}
.shb{animation:slideup .26s cubic-bezier(.2,.9,.3,1)}
.shbg{animation:fadein .22s ease-out}
.shb>div[id^="p_"]{animation:fadein .22s ease-out}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.up.bp{animation:bp .45s ease-out}
@keyframes bp{0%{box-shadow:0 0 0 0 var(--gold);transform:scale(.97)}60%{transform:scale(1.015)}100%{box-shadow:0 0 0 14px transparent;transform:none}}
.bar2 i{position:relative;overflow:hidden}
.bar2 i::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:adshine 2.6s ease-in-out infinite}
.flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,#fff,var(--gold) 45%,transparent 75%)}
.flash.on{animation:flashA .7s ease-out}
@keyframes flashA{0%{opacity:.95}100%{opacity:0}}
.toast.on{animation:toastin .38s cubic-bezier(.2,1.3,.4,1)}
@keyframes toastin{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
/* ---- עיצובים ---- */
html[data-skin="spark"]:root{--bg:#070b1f;--card:#0e1433;--text:#e8f0ff;--muted:#9aaadc;--line:#2c3c82;--ok:#46d19b;color-scheme:dark}
html[data-skin="rain"]:root{--bg:#0a2a33;--card:rgba(255,255,255,.09);--text:#eafffa;--muted:#a6d6cf;--line:rgba(255,255,255,.22);--ok:#6ff2c0;color-scheme:dark}
html[data-skin="ring"]:root{--bg:#1a0603;--card:#2a0e08;--text:#ffeee6;--muted:#d9a38f;--line:#6b2a18;--ok:#ffb454;color-scheme:dark}
html[data-skin="ocean"]:root{--bg:#04202e;--card:#0a3347;--text:#e6f7ff;--muted:#8fc1d6;--line:#17506b;--ok:#52e0c4;color-scheme:dark}
html[data-skin="forest"]:root{--bg:#0d1f14;--card:#16301f;--text:#eaf7e8;--muted:#9bc5a0;--line:#2b5a37;--ok:#9be564;color-scheme:dark}
html[data-skin="sunset"]:root{--bg:#1d0b2e;--card:#2e1248;--text:#fff0fa;--muted:#d7a6e6;--line:#6a2a8f;--ok:#ffd166;color-scheme:dark}
html[data-skin="royal"]:root{--bg:#110d05;--card:#1d1608;--text:#fff6dc;--muted:#cdb77a;--line:#5c4712;--ok:#ffd34d;color-scheme:dark}
html[data-skin="spark"] body{background:radial-gradient(ellipse at 50% 0,#1d2d72,#070b1f 65%) fixed}
html[data-skin="rain"] body{background:linear-gradient(125deg,#0b3d4a,#3a1c71,#0b6e4f,#0b3d4a);background-size:300% 300%;animation:flow 16s ease-in-out infinite}
html[data-skin="ring"] body{background:linear-gradient(0deg,#5a1606,#1a0603 45%,#0d0201);background-size:100% 220%;animation:ember 6s ease-in-out infinite}
html[data-skin="ocean"] body{background:linear-gradient(180deg,#0a4a63,#04202e 55%,#02121b)}
html[data-skin="forest"] body{background:linear-gradient(180deg,#143d22,#0d1f14 60%,#08130c)}
html[data-skin="sunset"] body{background:linear-gradient(180deg,#ff5e8a 0,#7b2cbf 38%,#1d0b2e 70%) fixed}
html[data-skin="royal"] body{background:radial-gradient(ellipse at 50% 0,#4a3710,#110d05 60%) fixed}
html[data-skin] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
html[data-skin="spark"] body::before{opacity:.1;background:linear-gradient(var(--gold) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--gold) 1px,transparent 1px) 0 0/48px 48px;animation:grid 6s linear infinite}
html[data-skin="rain"] body::before{inset:-20%;background:radial-gradient(circle at 20% 30%,rgba(120,255,214,.28),transparent 40%),radial-gradient(circle at 80% 20%,rgba(190,120,255,.28),transparent 40%),radial-gradient(circle at 50% 90%,rgba(80,160,255,.25),transparent 45%);animation:drift 18s ease-in-out infinite alternate}
html[data-skin="ring"] body::before{opacity:.55;background:radial-gradient(circle,#ff9a3c 0 2px,transparent 3px) 0 0/90px 120px,radial-gradient(circle,#ff5a1f 0 1.5px,transparent 3px) 45px 60px/70px 90px;animation:rise 7s linear infinite}
html[data-skin="ocean"] body::before{opacity:.5;background:radial-gradient(circle,rgba(255,255,255,.5) 0 2px,transparent 3px) 0 0/70px 90px,radial-gradient(circle,rgba(255,255,255,.35) 0 3px,transparent 4px) 30px 40px/110px 130px;animation:bubbles 9s linear infinite}
html[data-skin="forest"] body::before{opacity:.55;background:radial-gradient(circle,#d8ff7a 0 2px,transparent 4px) 0 0/120px 140px,radial-gradient(circle,#fff3a0 0 1.5px,transparent 3px) 60px 70px/160px 120px;animation:fly 12s ease-in-out infinite alternate}
html[data-skin="sunset"] body::before{opacity:.5;background:radial-gradient(circle at 50% 24%,#ffe36e 0 70px,#ff8c42 71px 112px,transparent 114px);animation:sun 5s ease-in-out infinite alternate}
html[data-skin="royal"] body::before{background:linear-gradient(115deg,transparent 40%,rgba(255,220,120,.18) 50%,transparent 60%) 0 0/300% 100%;animation:shine 6s linear infinite}
html[data-skin="spark"] :is(.up,.card,.ai){border-color:var(--gold);box-shadow:0 0 14px -4px var(--gold)}
html[data-skin="spark"] .up{border-radius:4px 16px 4px 16px;border-inline-start:4px solid var(--gold)}
html[data-skin="rain"] :is(.up,.card,.ai){border-radius:22px;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
html[data-skin="ring"] :is(.up,.card,.ai){border-color:#c4501f;box-shadow:0 0 14px -5px #ff5a1f}
html[data-skin="ring"] .up{border-radius:6px;border-inline-start:5px solid #ff5a1f;background:linear-gradient(90deg,#3a1209,#2a0e08)}
html[data-skin="ocean"] :is(.up,.card,.ai){border-radius:18px;border-color:#2a7ea0}
html[data-skin="forest"] :is(.up,.card,.ai){border-radius:10px 24px 10px 24px;border-color:#3f7a4a}
html[data-skin="sunset"] :is(.up,.card,.ai){border-radius:0 18px 0 18px;border-color:#ff5e8a}
html[data-skin="royal"] :is(.up,.card,.ai){border-radius:6px;border-color:#d4a017;box-shadow:inset 0 0 0 1px #5c4712}
html[data-skin="spark"] .bal{text-shadow:0 0 18px var(--gold)}
html[data-skin="spark"] h2{color:var(--gold);text-shadow:0 0 10px var(--gold);letter-spacing:.5px}
html[data-skin="rain"] h2{color:#c9fff0}
html[data-skin="ring"] h2{color:#ffb454}
html[data-skin="royal"] h2{color:#ffd34d;letter-spacing:1px}
html[data-skin="spark"] .bar2 i{box-shadow:0 0 10px var(--gold)}
html[data-skin="spark"] .coin{background:radial-gradient(circle,#0b1236 0 54%,var(--gold) 55% 60%,#0b1236 61%);color:var(--gold);text-shadow:0 0 18px var(--gold);box-shadow:0 0 40px -6px var(--gold),inset 0 0 30px -10px var(--gold);animation:glow 2.2s ease-in-out infinite}
html[data-skin="rain"] .coin{background:conic-gradient(var(--gold),#fff9,var(--gold2),#fff9,var(--gold));box-shadow:0 10px 40px rgba(120,255,214,.4),inset 0 0 0 8px rgba(255,255,255,.28);animation:bob 3s ease-in-out infinite}
html[data-skin="ring"] .coin{background:radial-gradient(circle at 50% 40%,#fff3b0,#ffb347 35%,#ff5a1f 65%,#7a1500);box-shadow:0 0 50px -8px #ff5a1f,inset 0 0 0 6px rgba(255,220,160,.35);animation:pulse 1.4s ease-in-out infinite}
html[data-skin="ocean"] .coin{background:radial-gradient(circle at 35% 30%,#d7fbff,#4cc9f0 45%,#0a6b8f);box-shadow:0 0 40px -6px #4cc9f0,inset 0 0 0 6px rgba(255,255,255,.3);animation:bob 4s ease-in-out infinite}
html[data-skin="forest"] .coin{background:radial-gradient(circle at 40% 30%,#f4ffd1,#9bd45a 45%,#3b7a22);box-shadow:0 0 40px -8px #9be564,inset 0 0 0 6px rgba(255,255,255,.25);animation:sway 3s ease-in-out infinite}
html[data-skin="sunset"] .coin{background:linear-gradient(180deg,#ffe36e,#ff5e8a);box-shadow:0 0 44px -6px #ff5e8a,inset 0 0 0 6px rgba(255,255,255,.3);animation:pulse 2s ease-in-out infinite}
html[data-skin="royal"] .coin{background:conic-gradient(#fff2b0,#d4a017,#fff2b0,#b8860b,#fff2b0);box-shadow:0 0 46px -8px #ffd34d,inset 0 0 0 7px rgba(60,40,0,.35);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 56px var(--gold),inset 0 -10px 18px rgba(0,0,0,.18),inset 0 0 0 6px rgba(255,255,255,.28)}}
@keyframes bob{50%{translate:0 -10px}}
@keyframes pulse{50%{scale:1.06}}
@keyframes sway{50%{rotate:4deg}}
@keyframes flow{50%{background-position:100% 50%}}
@keyframes ember{50%{background-position:0 100%}}
@keyframes grid{to{background-position:0 48px,48px 0}}
@keyframes drift{to{transform:translate(6%,4%) rotate(8deg) scale(1.1)}}
@keyframes rise{to{background-position:0 -120px,45px -30px}}
@keyframes bubbles{to{background-position:0 -90px,30px -90px}}
@keyframes fly{to{background-position:40px -50px,100px 20px}}
@keyframes sun{to{transform:translateY(18px) scale(1.06)}}
@keyframes shine{to{background-position:-300% 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html[data-skin] body,html[data-skin] body::before,html[data-skin] .coin,.adb,.adb::after,.shb,.shbg,.shb>div[id^="p_"],.coin,.coin.tp::after,.up.bp,.bar2 i::after,.flash,.toast.on{animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="hdr"><button class="adb" id="adb" type="button"><span class="adi" id="adi">▶</span><span class="adt" id="adt">×2</span><i class="adp" id="adp"></i></button><div class="ttl" id="ttl"></div><button class="ob" id="setb" type="button">⚙️</button></div>

  <div id="lockv" hidden>
    <h2 id="lt"></h2>
    <p class="note" id="lp"></p>
    <button class="up" id="lb" type="button"><span class="inf"><div class="nm" id="lbn"></div><div class="ds" id="ld"></div></span></button>
  </div>

  <div id="gamev">
    <div class="top">
      <div class="bal"><span id="bal">0</span><small id="sym2">₿</small></div>
      <div class="sub" id="rate"></div>
    </div>
    <div class="stage"><button class="coin" id="coin"><span id="sym">₿</span><small id="cp">1</small></button></div>
    <div class="card"><div class="gt" id="gt"></div><div class="bar2"><i id="gb"></i></div><div class="gt" id="gu" style="margin:8px 0 0"></div></div>
    <button class="up off" id="db" type="button" style="margin-top:12px"><span class="ic">🎁</span><span class="inf"><div class="nm" id="dbn"></div><div class="ds" id="dd"></div></span><span class="pr" id="dp"></span></button>
    <h2 id="h_up"></h2>
    <div class="list" id="list"></div>
  </div>
</main>

<nav class="bar" id="nav">
  <button class="bb" id="bsk" type="button"><span id="bst"></span></button>
  <button class="bb" id="bcur" type="button"><span id="bcs">₿</span> ▴</button>
  <button class="bb" id="bfork" type="button">⛓️ <b id="bfp">0.00%</b></button>
  <button class="bb" id="bmis" type="button"><span id="bmt"></span></button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="shbg" id="shbg"></div>
  <div class="shb" role="dialog" aria-modal="true" aria-labelledby="sht">
    <div class="shh"><b id="sht"></b><button class="ob" id="shx" type="button">✕</button></div>

    <div id="p_cur" hidden><div class="list" id="p_cur_l"></div></div>

    <div id="p_skin" hidden>
      <p class="note" id="n_skins"></p>
      <div class="list" id="anims"></div>
    </div>

    <div id="p_fork" hidden>
      <p class="note" id="fpi"></p>
      <p class="note" id="fpl"></p>

/* ---- חוקי המשחק: פונקציות של (מטבע k, מצב C). בלי נגיעה במסך ---- */
function owned(C,id){return C.owned[id]||0}
function cnt(C){return MINERS.reduce(function(a,m){return a+owned(C,m.id)},0)}
function advCnt(C){return ADV.reduce(function(a,id){return a+owned(C,id)},0)}
function cost(k,C,m){return Math.ceil(m.base*k.ks*Math.pow(1.3,owned(C,m.id)))}
function tapCost(k,C){return Math.ceil(100*k.ks*Math.pow(1.4,C.tapLvl))}
function eff(C){return 1/(1+0.001*cnt(C))}
function boost(){return Date.now()<S.boost?2:1}
function capBoost(x){return Math.min(x,Date.now()+7200000)}
function unlockedN(){return CUR.filter(function(k){return S.c[k.id].on}).length-1}
function tiers(C){return MIS.reduce(function(a,m){return a+(C.mt[m.id]||0)},0)}
function totalFork(){return CUR.reduce(function(a,k){return a+S.c[k.id].fork},0)}
function mul(C){return 1+totalFork()/100+Math.min(MISS_CAP,MISS_BONUS*tiers(C))+UNLOCK_BONUS*unlockedN()}
function tapPower(k,C){return (1+C.tapLvl)*k.ks*mul(C)}
function baseRate(k,C){return MINERS.reduce(function(a,m){return a+owned(C,m.id)*m.rate},0)*k.ks*eff(C)*mul(C)}
function rate(k,C){return baseRate(k,C)*boost()}
function forkGain(k,C){var r=C.total/(FORK_BASE*k.ks);return r>=1?5*Math.sqrt(r):0}
function gemCost(k,C){return Math.ceil(GEM_BASE*k.ks*Math.pow(1.35,C.dq))}
function add(C,n){if(!(n>0))return;C.coins=Math.min(C.coins+n,1e30);C.total=Math.min(C.total+n,1e30);C.life=Math.min(C.life+n,1e30)}
